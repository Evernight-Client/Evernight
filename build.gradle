plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'idea'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        url = 'https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1'
        content { includeGroup 'me.djtheredstoner' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.2b2t.vc/releases'
        content { includeGroup 'com.github.rfresh2' }
    }
}

configurations {
    viaDistribution { transitive = false }
    entityCullingDistribution { transitive = false }
    xaeroDistribution { transitive = false }
}

def nestedLibraries = { configuration, patterns ->
    files(providers.provider {
        zipTree(configuration.singleFile).matching(patterns).files
    })
}

def viaFabricPlusModules = nestedLibraries(configurations.viaDistribution) {
    include 'META-INF/jars/viafabricplus-*.jar'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modCompileOnly('maven.modrinth:viafabricplus:RM6hveoK') { exclude group: 'dev.kastle.webrtc' }
    modLocalRuntime('maven.modrinth:viafabricplus:RM6hveoK') { exclude group: 'dev.kastle.webrtc' }
    modCompileOnly 'maven.modrinth:lithium:Ow7wA0kG'
    modCompileOnly 'maven.modrinth:immediatelyfast:4EwhsTu7'
    modCompileOnly 'maven.modrinth:sodium:rkdTcxoT'
    modLocalRuntime 'maven.modrinth:sodium:rkdTcxoT'
    modCompileOnly 'maven.modrinth:xaeros-minimap:g0LRDWwe'
    modLocalRuntime 'maven.modrinth:xaeros-minimap:g0LRDWwe'
    modCompileOnly 'maven.modrinth:entityculling:bTu42fvx'
    modLocalRuntime 'maven.modrinth:entityculling:bTu42fvx'
    // Litematica (schematic mod) and its dependency MaLiLib: compile-time read-only, available at
    // dev runtime for integration testing, and not shipped in the release jar.
    modCompileOnly "maven.modrinth:litematica:${litematica_version}"
    modLocalRuntime "maven.modrinth:litematica:${litematica_version}"
    modCompileOnly "maven.modrinth:malilib:${malilib_version}"
    modLocalRuntime "maven.modrinth:malilib:${malilib_version}"
    modLocalRuntime 'me.djtheredstoner:DevAuth-fabric:1.2.2'
    compileOnly 'org.jetbrains:annotations:26.0.2'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The language-table test only needs Gson; declare it explicitly so the test classpath does not
    // depend on Loom's Minecraft configuration.
    testImplementation 'com.google.code.gson:gson:2.11.0'

    modCompileOnly 'com.github.rfresh2:baritone-fabric:1.21.11-SNAPSHOT'
    modLocalRuntime 'com.github.rfresh2:baritone-fabric:1.21.11-SNAPSHOT'
    viaDistribution 'maven.modrinth:viafabricplus:RM6hveoK'
    entityCullingDistribution 'maven.modrinth:entityculling:bTu42fvx'
    xaeroDistribution 'maven.modrinth:xaeros-minimap:g0LRDWwe'

    implementation nestedLibraries(configurations.viaDistribution) {
        include 'META-INF/jars/*.jar'
        exclude 'META-INF/jars/fabric-*.jar', 'META-INF/jars/gson-2*.jar',
            'META-INF/jars/viafabricplus-*.jar', 'META-INF/jars/webrtc-*.jar'
    }
    modCompileOnly viaFabricPlusModules
    modLocalRuntime viaFabricPlusModules
    modLocalRuntime nestedLibraries(configurations.entityCullingDistribution) {
        include 'META-INF/jars/*.jar'
    }
    // Xaero's minimap bundles XaeroLib as a nested jar under META-INF/jars; the dev runtime does not
    // unpack it, so extract that jar and add it as a separate runtime mod, otherwise startup fails
    // with "requires xaerolib".
    modLocalRuntime nestedLibraries(configurations.xaeroDistribution) {
        include 'META-INF/jars/xaerolib-*.jar'
    }
}

loom {
    accessWidenerPath = file('src/main/resources/evernight.accesswidener')
    runs {
        client {
            client()
            name = 'Evernight Client'
            runDir = 'run'
            ideConfigGenerated = true
        }
    }
}

def modVersion = project.version

processResources {
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand version: modVersion }

    // License and third-party notices ship inside the jar, as required by GPL-3.0 and by the
    // licenses of the bundled components.
    from('LICENSE') { into 'META-INF' }
    from('licenses') { into 'META-INF/licenses' }
}

java {
    withSourcesJar()
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    options.release = targetJavaVersion
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none', '-Xlint:deprecation', '-Xlint:-unchecked']
    options.fork = true
    options.forkOptions.memoryMaximumSize = providers.environmentVariable('CI').isPresent() ? '384m' : '4g'
}

tasks.named('remapJar') {
    def serviceOptions = tinyRemapperServiceOptions.get()
    serviceOptions.classpath.setFrom(sourceSets.main.compileClasspath)
    tinyRemapperServiceOptions.set(serviceOptions)
}

tasks.named('runClient') {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Unit tests run as part of `build`; `releaseTest` is kept as the explicit pre-release gate.
tasks.register('releaseTest') {
    group = 'verification'
    description = 'Pre-release gate: build (includes unit tests).'
    dependsOn 'build'
}
