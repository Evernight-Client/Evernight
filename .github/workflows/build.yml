name: Build

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate language tables
        run: python3 .github/skills/evernight-dev/scripts/check-lang.py

      - name: Fetch vault engine binaries
        env:
          ENGINE_TAG: ${{ vars.VAULT_ENGINE_TAG }}
        run: |
          mkdir -p native/vault-dist
          owner="${{ github.repository_owner }}"
          if [ -n "$ENGINE_TAG" ]; then
            base="https://github.com/$owner/evernight-vault-engine/releases/download/$ENGINE_TAG"
          else
            base="https://github.com/$owner/evernight-vault-engine/releases/latest/download"
          fi
          missing=0
          for name in \
            vaulttool-windows-x86_64.exe \
            vaulttool-windows-aarch64.exe \
            vaulttool-linux-x86_64 \
            vaulttool-linux-aarch64 \
            vaulttool-android-aarch64 \
            vaulttool-macos-universal; do
            if ! curl -fsSL --retry 3 --retry-delay 2 "$base/$name" -o "native/vault-dist/$name"; then
              echo "missing vault engine: $name"
              missing=$((missing + 1))
            fi
          done
          ls -l native/vault-dist
          if [ "$missing" -gt 0 ]; then
            echo "::warning::$missing vault engine binaries were unavailable; the jar will hide the vault prediction module"
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: evernight-jars
          path: build/libs/*.jar
          if-no-files-found: error
